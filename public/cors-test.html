<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test for Videos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            margin-bottom: 20px;
        }
        .video-container {
            margin-bottom: 30px;
        }
        video {
            max-width: 100%;
            border: 1px solid #ddd;
        }
        .info {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .error {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>CORS Test for Videos</h1>
    
    <div class="info">
        <p>This page tests video playback directly without any framework or complex code. It uses the crossOrigin="anonymous" attribute to test CORS issues.</p>
    </div>
    
    <div class="video-container">
        <h2>Video with crossOrigin="anonymous"</h2>
        <video controls crossOrigin="anonymous" width="640" height="360">
            <source src="https://gruc9opbjll8ofcl.public.blob.vercel-storage.com/view1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div id="error1" class="error" style="display: none;"></div>
    </div>
    
    <div class="video-container">
        <h2>Video without crossOrigin attribute</h2>
        <video controls width="640" height="360">
            <source src="https://gruc9opbjll8ofcl.public.blob.vercel-storage.com/view1.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <div id="error2" class="error" style="display: none;"></div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const video1 = document.querySelector('video[crossOrigin]');
            const video2 = document.querySelector('video:not([crossOrigin])');
            const error1 = document.getElementById('error1');
            const error2 = document.getElementById('error2');
            
            video1.addEventListener('error', function() {
                if (video1.error) {
                    error1.textContent = `Error with crossOrigin="anonymous": ${getErrorMessage(video1.error)}`;
                    error1.style.display = 'block';
                }
            });
            
            video2.addEventListener('error', function() {
                if (video2.error) {
                    error2.textContent = `Error without crossOrigin: ${getErrorMessage(video2.error)}`;
                    error2.style.display = 'block';
                }
            });
            
            function getErrorMessage(error) {
                switch (error.code) {
                    case 1:
                        return 'MEDIA_ERR_ABORTED: The fetching process was aborted by the user';
                    case 2:
                        return 'MEDIA_ERR_NETWORK: A network error caused the video download to fail';
                    case 3:
                        return 'MEDIA_ERR_DECODE: The video playback was aborted due to a corruption problem or because the video used features your browser did not support';
                    case 4:
                        return 'MEDIA_ERR_SRC_NOT_SUPPORTED: The video could not be loaded, either because the server or network failed or because the format is not supported';
                    default:
                        return `Unknown error (${error.code}): ${error.message}`;
                }
            }
        });
    </script>
</body>
</html>
